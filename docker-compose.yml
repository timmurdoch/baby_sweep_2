version: '3.8'

services:
  baby-sweep:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baby-sweep
    ports:
      - "3001:3001"
    volumes:
      # Persist database data
      - ./data:/app/backend/data
    environment:
      - PORT=3001
      - APP_PASSWORD=${APP_PASSWORD:-babysweep2025}
      - DUE_DATE=${DUE_DATE:-2025-12-31}
      - TIME_BLOCK_MINUTES=${TIME_BLOCK_MINUTES:-30}
      - MAX_BLOCK_SELECTION_MINUTES=${MAX_BLOCK_SELECTION_MINUTES:-60}
      - INCLUDE_SURPRISE_GENDER=${INCLUDE_SURPRISE_GENDER:-true}
      - ALLOW_DUPLICATES=${ALLOW_DUPLICATES:-false}
      - PRIMARY_COLOR=${PRIMARY_COLOR:-#4A90E2}
      - WELCOME_TEXT=${WELCOME_TEXT:-Welcome to our Baby Sweep! Make your guess about when our little one will arrive.}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - baby-sweep-network

networks:
  baby-sweep-network:
    driver: bridge
