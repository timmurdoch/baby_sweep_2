# ============================================================================
# NGINX Configuration for Baby Sweep
# ============================================================================
#
# This configuration serves as a reverse proxy for the Baby Sweep application.
# Place this file in /etc/nginx/sites-available/ and create a symlink to
# /etc/nginx/sites-enabled/
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/baby-sweep
#   sudo ln -s /etc/nginx/sites-available/baby-sweep /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================================

upstream baby_sweep_backend {
    server localhost:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain name
    server_name babysweep.example.com;

    # Increase client body size for file uploads (if needed in future)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/baby-sweep-access.log;
    error_log /var/log/nginx/baby-sweep-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # Proxy to Node.js backend
    location / {
        proxy_pass http://baby_sweep_backend;
        proxy_http_version 1.1;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static file caching (for built React assets)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://baby_sweep_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

